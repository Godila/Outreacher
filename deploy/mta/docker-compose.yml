services:
  mailserver:
    image: ghcr.io/docker-mailserver/docker-mailserver:latest
    container_name: dms
    hostname: mta-news.adel-factory.ru
    ports:
      - "25:25"      # SMTP: приём входящих ответов/bounce + ретрансляция наружу
      - "127.0.0.1:587:587"  # submission (доступ снаружи ограничен ufw до VM-APP)
      - "127.0.0.1:993:993"  # IMAPS (аналогично)
    volumes:
      - ./docker-data/dms/mail-data/:/var/mail/
      - ./docker-data/dms/mail-state/:/var/mail-state/
      - ./docker-data/dms/config/:/tmp/docker-mailserver/
      - ./docker-data/dms/config/custom/:/tmp/docker-mailserver-custom/
      - ./letsencrypt:/etc/letsencrypt:ro
    env_file: mailserver.env
    cap_add: [NET_ADMIN]  # fail2ban
    restart: unless-stopped
