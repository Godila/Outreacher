services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-outreacher}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-outreacher}
      POSTGRES_DB: ${POSTGRES_DB:-outreacher}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8080:8000"
    env_file: .env
    depends_on:
      - postgres
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: python -m app.worker
    env_file: .env
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  pgdata: {}
